plugins {
    id 'com.android.application'
}

// 本地签名配置：存在 keystore.properties 时启用 release 签名
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.phoneconsole.client'
    compileSdk 34

    defaultConfig {
        applicationId "com.phoneconsole.client"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "0.2.0"
    }

    signingConfigs {
        if (!keystoreProps.isEmpty()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (!keystoreProps.isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }

    // 输出固定文件名，便于拷贝安装
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "phone-console-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    // 仅用于扫码解析（纯 Java，无 Android 组件），预览由 Camera API 自行实现
    implementation 'com.google.zxing:core:3.5.3'
}
